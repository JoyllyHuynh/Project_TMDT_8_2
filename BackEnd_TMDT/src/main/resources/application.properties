spring.application.name=comicworm
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# MySQL — database name must match comicworm_schema.sql
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/comicworm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Root@123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Set APP_JWT_SECRET to a strong random value outside local development.
app.jwt.secret=${APP_JWT_SECRET:ComicWormLocalDevelopmentSecretKeyChangeInProduction}
app.jwt.expiration-ms=86400000
app.jwt.remember-me-expiration-ms=2592000000

app.cors.allowed-origins=http://localhost:63342,http://localhost:3000,http://127.0.0.1:5500

app.auth.password-reset.expiration-minutes=15
app.auth.password-reset.frontend-url=http://127.0.0.1:5500/Project_TMDT_8_2/src/vu/auth/reset-password/reset-password.html
app.auth.password-reset.log-link=${APP_AUTH_LOG_PASSWORD_RESET_LINK:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.auth.password-reset.email-enabled=true
app.auth.password-reset.from=${SPRING_MAIL_USERNAME}
